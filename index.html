<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DebMitra – Tumhara AI Dost</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#ffe3f1 0%,#e0e7ff 50%,#d9f7ee 100%);color:#1f1d1a;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f97316);color:#fff;font-weight:600;font-size:18px;box-shadow:0 2px 12px rgba(236,72,153,.35);padding-top:calc(14px + env(safe-area-inset-top,0px))}
header span{font-weight:400;font-size:13px;opacity:.9}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.u{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-bottom-right-radius:4px;box-shadow:0 3px 10px rgba(139,92,246,.35)}
.a{align-self:flex-start;border-left:5px solid #06b6d4;background:#e6fbff;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.a:nth-of-type(3n+2){border-left-color:#f59e0b;background:#fff4dc}
.a:nth-of-type(3n+3){border-left-color:#10b981;background:#e3f9ee}
.hint{color:#6d28d9;text-align:center;margin:auto;padding:20px;font-size:16px}
form{display:flex;gap:8px;padding:10px 12px calc(72px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.55);backdrop-filter:blur(8px)}
input{flex:1;padding:12px 14px;border-radius:22px;border:2px solid #c4b5fd;background:#fff;color:#1f1d1a;font-size:16px}
input:focus{outline:0;border-color:#ec4899}
button{padding:0 20px;border:0;border-radius:22px;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;font-size:15px;font-weight:600;box-shadow:0 3px 10px rgba(249,115,22,.4)}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>✨ DebMitra <span>· tumhara AI dost</span></header>
<div id="chat"><div class="hint" id="hint">Namaste! Main DebMitra hoon, tumhara AI dost. Kuch bhi pooche — Hindi, English ya Hinglish mein. 😊</div></div>
<form id="f"><input id="q" placeholder="Apna sawaal likho..." autocomplete="off"><button id="b">Send</button></form>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q'),b=document.getElementById('b');
let history=[];
function add(cls,t){document.getElementById('hint')?.remove();const d=document.createElement('div');d.className='m '+cls;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const t=q.value.trim();if(!t)return;
  q.value='';b.disabled=true;add('u',t);
  history.push({role:'user',content:t});
  const out=add('a','…');
  try{
    let r,d;
    for(let i=0;i<4;i++){
      if(i>0)out.textContent='Thoda ruko, dobara koshish kar raha hoon… ('+i+')';
      r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
      d=await r.json().catch(()=>({error:'Error'}));
      if(r.ok||(r.status!==503&&r.status!==500))break;
      await new Promise(res=>setTimeout(res,2500));
    }
    if(!r.ok)throw new Error(r.status===503?'Gemini abhi bahut busy hai, 1-2 minute baad dobara try karo.':(d.error||'Error'));
    out.textContent=d.reply;history.push({role:'assistant',content:d.reply});
  }catch(err){out.textContent=err.message||'Kuch gadbad ho gayi, thodi der baad try karo.';history.pop()}
  b.disabled=false;q.focus();
});
</script>
</body>
</html>
