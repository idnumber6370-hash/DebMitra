<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DebMitra – Tumhara AI Dost</title>
<meta name="theme-color" content="#00071a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#ffe3f1 0%,#e0e7ff 50%,#d9f7ee 100%);color:#1f1d1a;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(90deg,#8b5cf6,#ec4899,#f97316);color:#fff;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px rgba(236,72,153,.35)}
header .lg{width:38px;height:38px;border-radius:10px;flex:none}
header .t{flex:1;font-weight:700;font-size:18px;line-height:1.1}
header .t small{display:block;font-weight:400;font-size:12px;opacity:.9}
.hb{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px;padding:0;cursor:pointer;flex:none}
#panel{background:#fff;margin:0 10px;padding:14px;border-radius:0 0 20px 20px;box-shadow:0 10px 28px rgba(80,40,140,.25);display:flex;flex-direction:column;gap:14px}
#panel[hidden]{display:none}
#panel .lab{font-weight:700;font-size:14px;color:#6d28d9;margin-bottom:8px}
#panel .tip{font-size:12.5px;color:#8a7fa8;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 15px;border-radius:20px;border:2px solid #d8ccff;background:#f7f3ff;color:#6d28d9;font-weight:600;font-size:14.5px}
.chips button.on{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(139,92,246,.4)}
#panel .row{display:flex;gap:8px}
.pb{flex:1;padding:11px;border-radius:14px;border:2px solid #d8ccff;background:#fff;color:#6d28d9;font-weight:700;font-size:14.5px}
.pb[disabled]{opacity:.7}
#ibar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff4d6;color:#5b4300;font-size:14px}
#ibar[hidden]{display:none}
#ibar span{flex:1}
#ibar button{background:#f97316;color:#fff;border-radius:14px;padding:6px 14px;font-size:14px}
#ibar button.x{background:none;color:#5b4300;padding:4px 8px;font-size:17px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.u{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-bottom-right-radius:4px;box-shadow:0 3px 10px rgba(139,92,246,.35)}
.u img{display:block;max-width:100%;max-height:180px;border-radius:10px;margin-bottom:6px}
.a{align-self:flex-start;border-left:5px solid #06b6d4;background:#e6fbff;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.a:nth-of-type(3n+2){border-left-color:#f59e0b;background:#fff4dc}
.a:nth-of-type(3n+3){border-left-color:#10b981;background:#e3f9ee}
.a code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.a pre{margin:6px 0;background:#10131a;color:#e8e8f0;padding:10px;border-radius:10px;overflow-x:auto;white-space:pre}
.a pre code{background:none;padding:0;color:inherit}
.act{display:flex;gap:6px;margin-top:6px}
.act button{background:rgba(0,0,0,.07);color:inherit;border:0;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:500}
.dots{display:inline-flex;gap:5px;padding:4px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:#8b5cf6;animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){background:#ec4899;animation-delay:.18s}
.dots i:nth-child(3){background:#f97316;animation-delay:.36s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-6px);opacity:1}}
.hint{color:#6d28d9;text-align:center;margin:auto;padding:20px;font-size:16px}
#chip{display:flex;align-items:center;gap:8px;margin:0 12px;padding:6px 10px;background:#fff;border:2px solid #c4b5fd;border-radius:14px;font-size:14px}
#chip[hidden]{display:none}
#chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip button{background:none;color:#6d28d9;padding:0 6px;font-size:18px}
form{display:flex;gap:6px;align-items:center;padding:8px 10px calc(72px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.55);backdrop-filter:blur(8px)}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border-radius:22px;border:2px solid #c4b5fd;background:#fff;color:#1f1d1a;font-size:16px}
input[type=text]:focus{outline:0;border-color:#ec4899}
button{border:0;color:#fff;font-weight:600}
.rb{width:42px;height:42px;border-radius:50%;background:#fff;color:#6d28d9;border:2px solid #c4b5fd;font-size:18px;padding:0;flex:none}
.rb.on{background:#ef4444;color:#fff;border-color:#ef4444;animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(239,68,68,.2)}}
#send{padding:0 16px;height:42px;border-radius:22px;background:linear-gradient(135deg,#f97316,#ec4899);font-size:15px;box-shadow:0 3px 10px rgba(249,115,22,.4);flex:none}
#send:disabled{opacity:.5}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.show{opacity:.95}
@media (prefers-color-scheme:dark){
body{background:linear-gradient(160deg,#2a1a3a 0%,#1a2140 50%,#12302b 100%);color:#f1ede6}
.a{background:#143a42;color:#f1ede6}.a:nth-of-type(3n+2){background:#40321a}.a:nth-of-type(3n+3){background:#15392a}
.hint{color:#c4b5fd}form{background:rgba(0,0,0,.35)}
input[type=text],#chip{background:#262320;color:#f1ede6;border-color:#6d28d9}
.pb{background:#262320;color:#e0d4ff;border-color:#6d28d9}
.chips button{background:#2a2540;color:#e0d4ff;border-color:#4b3b86}
#ibar{background:#40321a;color:#ffe9b8}#ibar button.x{color:#ffe9b8}
#panel{background:#1c1730;color:#f1ede6}#panel .lab{color:#c4b5fd}
.rb{background:#262320;color:#c4b5fd;border-color:#6d28d9}
}
</style>
</head>
<body>
<header>
  <img src="/icon-192.png" alt="" class="lg">
  <div class="t">DebMitra<small>tumhara AI dost</small></div>
  <button class="hb" id="spk" title="Jawab bol ke sunao">🔇</button>
  <button class="hb" id="gear" title="Settings">⚙️</button>
</header>
<div id="panel" hidden>
  <div>
    <div class="lab">🌐 Language</div>
    <div class="chips" id="chLang">
      <button type="button" data-v="auto">Auto</button>
      <button type="button" data-v="hi">हिन्दी</button>
      <button type="button" data-v="en">English</button>
      <button type="button" data-v="or">ଓଡ଼ିଆ</button>
    </div>
    <div class="tip">Auto: tum jis bhasha mein likho, DebMitra usi mein jawab dega.</div>
  </div>
  <div>
    <div class="lab">🎭 Mode</div>
    <div class="chips" id="chMode">
      <button type="button" data-v="friend">😊 Friend</button>
      <button type="button" data-v="tutor">📚 Tutor</button>
      <button type="button" data-v="coder">💻 Coder</button>
      <button type="button" data-v="funny">😄 Funny</button>
    </div>
  </div>
  <div class="row">
    <button type="button" class="pb" id="inst">📲 Install app</button>
    <button type="button" class="pb" id="clr">🗑 New chat</button>
  </div>
</div>
<div id="ibar" hidden><span>📲 DebMitra ko app ki tarah install karo</span><button type="button" id="ibtn">Install</button><button type="button" class="x" id="ix">✕</button></div>
<div id="chat"></div>
<div id="chip" hidden><span id="chipt"></span><button type="button" id="chipx">✕</button></div>
<form id="f">
  <button type="button" class="rb" id="att" title="Photo ya PDF">📎</button>
  <button type="button" class="rb" id="mic" title="Bol ke poochho">🎤</button>
  <input type="text" id="q" placeholder="Apna sawaal likho..." autocomplete="off">
  <button id="send">Send</button>
</form>
<input type="file" id="file" accept="image/*,application/pdf" hidden>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),q=$('q'),send=$('send'),chip=$('chip');
const KEY='debmitra_v2',SKEY='debmitra_set';
let st={msgs:[],doc:null},set={lang:'auto',mode:'friend',speak:false},pending=null,busy=false,sent=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.msgs))st=s}catch(e){}
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)set=Object.assign(set,s)}catch(e){}
function save(){try{st.msgs=st.msgs.slice(-60);localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function saveSet(){try{localStorage.setItem(SKEY,JSON.stringify(set))}catch(e){}}
function scroll(){chat.scrollTop=chat.scrollHeight}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3500)}
/* text helpers */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){
  s=esc(String(s));const blocks=[];
  s=s.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return '\u0001'+(blocks.length-1)+'\u0001'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|\n)#{1,6}\s*(.+)/g,'$1<b>$2</b>');
  s=s.replace(/(^|\n)[ \t]*[*-][ \t]+/g,'$1• ');
  return s.replace(/\u0001(\d+)\u0001/g,(m,i)=>blocks[i]);
}
function plain(t){return String(t).replace(/```[a-zA-Z0-9]*\n?/g,'').replace(/\*\*/g,'').replace(/`/g,'').replace(/^#+\s*/gm,'').replace(/^\s*[*-]\s+/gm,'• ')}
/* copy / share */
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('Copy ho gaya ✅')}
function share(t){if(navigator.share)navigator.share({title:'DebMitra',text:plain(t)+'\n\n— DebMitra: '+location.origin}).catch(()=>{});else copy(plain(t))}
function actions(t){
  const d=document.createElement('div');d.className='act';
  const b1=document.createElement('button');b1.textContent='📋 Copy';b1.type='button';b1.onclick=()=>copy(plain(t));
  const b2=document.createElement('button');b2.textContent='📤 Share';b2.type='button';b2.onclick=()=>share(t);
  d.append(b1,b2);return d;
}
/* bubbles */
function addUser(t,img){
  const d=document.createElement('div');d.className='m u';
  if(img){const i=document.createElement('img');i.src=img;d.appendChild(i)}
  const s=document.createElement('span');s.textContent=t;d.appendChild(s);chat.appendChild(d);scroll();
}
function addBot(t){
  const d=document.createElement('div');d.className='m a';
  const b=document.createElement('span');b.className='body';d.appendChild(b);chat.appendChild(d);
  if(t!=null){b.innerHTML=md(t);d.appendChild(actions(t))}
  scroll();return{el:d,body:b};
}
function hello(){
  chat.innerHTML='';
  if(!st.msgs.length){const h=document.createElement('div');h.className='hint';h.textContent='Namaste! Main DebMitra hoon, tumhara AI dost. Likh ke, bol ke 🎤, ya photo/PDF 📎 bhej ke kuch bhi pooche. ⚙️ se bhasha aur mode badal sakte ho. 😊';chat.appendChild(h);return}
  st.msgs.forEach(m=>{if(m.r==='user')addUser(m.t+(m.img?' 📷':''));else addBot(m.t)});
}
hello();
/* settings */
function paintChips(){document.querySelectorAll('#chLang button').forEach(b=>b.classList.toggle('on',b.dataset.v===set.lang));document.querySelectorAll('#chMode button').forEach(b=>b.classList.toggle('on',b.dataset.v===set.mode))}
document.querySelectorAll('#chLang button').forEach(b=>b.onclick=()=>{set.lang=b.dataset.v;saveSet();paintChips();if(rec&&listening)rec.stop();toast('Language badal gayi ✅')});
document.querySelectorAll('#chMode button').forEach(b=>b.onclick=()=>{set.mode=b.dataset.v;saveSet();paintChips();toast('Mode badal gaya ✅')});
paintChips();
$('gear').onclick=()=>{$('panel').hidden=!$('panel').hidden};
$('clr').onclick=()=>{if(!confirm('Poori chat delete kar du?'))return;st={msgs:[],doc:null};pending=null;chip.hidden=true;save();hello();$('panel').hidden=true;window.speechSynthesis&&speechSynthesis.cancel()};
/* voice output */
let voices=[],warned={};
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function updSpk(){$('spk').textContent=set.speak?'🔊':'🔇'}updSpk();
$('spk').onclick=()=>{set.speak=!set.speak;saveSet();updSpk();if(!set.speak&&window.speechSynthesis)speechSynthesis.cancel();toast(set.speak?'Ab jawab bol ke sunaunga 🔊':'Awaaz band 🔇')};
const norm=l=>String(l).replace('_','-').toLowerCase();
function ttsLang(t){
  if(set.lang==='hi')return'hi-IN';if(set.lang==='en')return'en-IN';if(set.lang==='or')return'or-IN';
  if(/[\u0B00-\u0B7F]/.test(t))return'or-IN';if(/[\u0900-\u097F]/.test(t))return'hi-IN';return'en-IN';
}
function pickVoice(lang){
  const base=lang.split('-')[0],c=voices.filter(v=>norm(v.lang).startsWith(base));
  if(!c.length)return null;
  const good=/google|neural|enhanced|natural|wavenet/i;
  return c.find(v=>good.test(v.name)&&norm(v.lang)===norm(lang))||c.find(v=>good.test(v.name))||c.find(v=>norm(v.lang)===norm(lang))||c[0];
}
function ttsSegments(sentence,main){
  if(main==='en-IN')return[{t:sentence,l:'en-IN'}];
  const out=[];
  sentence.split(/([A-Za-z][A-Za-z0-9'’+&\-]*(?:[ ,.\-]+[A-Za-z0-9][A-Za-z0-9'’+&\-]*)*)/).forEach((p,i)=>{
    if(!p||!/[\p{L}\p{N}]/u.test(p))return;
    out.push({t:p,l:i%2?'en-IN':main});
  });
  return out;
}
function speak(t){
  if(!set.speak||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const p=plain(t).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,''),main=ttsLang(p),vm=pickVoice(main);
  if(!vm&&!warned[main]){warned[main]=1;toast('Is bhasha ki voice phone mein nahi mili. Phone Settings → Google → Speech Services → Text-to-speech mein voice data download karo.')}
  const vc={};const vFor=l=>l in vc?vc[l]:(vc[l]=pickVoice(l));
  const sents=p.match(/[^.!?।\n]+[.!?।]?/g)||[p],q2=[];
  for(const s of sents)for(const seg of ttsSegments(s,main)){
    let txt=seg.t.trim();
    while(txt.length>170){let k=txt.lastIndexOf(' ',170);if(k<60)k=170;q2.push({t:txt.slice(0,k),l:seg.l});txt=txt.slice(k).trim()}
    if(txt)q2.push({t:txt,l:seg.l});
  }
  q2.slice(0,45).forEach(c=>{const u=new SpeechSynthesisUtterance(c.t);u.lang=c.l;const v=vFor(c.l);if(v)u.voice=v;u.rate=0.95;u.pitch=1;speechSynthesis.speak(u)});
}
/* voice input */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
const recLang=()=>({hi:'hi-IN',en:'en-IN',or:'or-IN',auto:'hi-IN'})[set.lang]||'hi-IN';
$('mic').onclick=()=>{
  if(!SR){toast('Is browser mein voice nahi chalta. Chrome use karo.');return}
  if(listening){rec&&rec.stop();return}
  rec=new SR();rec.lang=recLang();rec.interimResults=true;rec.continuous=false;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;q.value=t};
  rec.onerror=ev=>{if(ev.error==='not-allowed')toast('Mic ki permission Allow karo.');else if(ev.error==='language-not-supported')toast('Is bhasha ki voice input phone par nahi chal rahi.')};
  rec.onend=()=>{listening=false;$('mic').classList.remove('on');q.placeholder='Apna sawaal likho...';if(q.value.trim()){set.speak=true;saveSet();updSpk();go()}};
  listening=true;$('mic').classList.add('on');q.placeholder='Bolo, main sun raha hoon...';
  try{rec.start()}catch(e){listening=false;$('mic').classList.remove('on')}
};
/* attach */
$('att').onclick=()=>$('file').click();
$('chipx').onclick=()=>{pending=null;chip.hidden=true};
function readImg(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};im.onerror=rej;im.src=u})}
function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};s.onerror=rej;document.head.appendChild(s)})}
async function pdfText(f){
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
  for(let i=1;i<=Math.min(pdf.numPages,25);i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n';if(out.length>9000)break}
  return out.slice(0,9000).trim();
}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.type.startsWith('image/')){pending={type:'img',data:await readImg(f),name:f.name};$('chipt').textContent='📷 '+f.name}
    else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      $('chipt').textContent='PDF padh raha hoon...';chip.hidden=false;
      const t=await pdfText(f);
      if(!t){chip.hidden=true;toast('Is PDF mein text nahi mila (shayad scan ki hui hai).');return}
      pending={type:'pdf',name:f.name,text:t};$('chipt').textContent='📄 '+f.name
    }else{toast('Sirf photo ya PDF chalegi.');return}
    chip.hidden=false;
  }catch(err){chip.hidden=true;pending=null;toast('File nahi khul paayi, dusri try karo.')}
};
/* send */
function typeOut(el,text){return new Promise(res=>{let i=0;const step=Math.max(1,Math.ceil(text.length/140));const iv=setInterval(()=>{i+=step;el.textContent=text.slice(0,i);scroll();if(i>=text.length){clearInterval(iv);res()}},18)})}
async function go(){
  if(busy)return;
  let text=q.value.trim();
  if(!text&&!pending)return;
  const now=Date.now();sent=sent.filter(t=>now-t<60000);
  if(sent.length>=10){toast('Bahut tez! '+Math.ceil((60000-(now-sent[0]))/1000)+' second ruko, phir bhejo. 🙂');return}
  sent.push(now);
  const img=pending&&pending.type==='img'?pending.data:null;
  if(pending&&pending.type==='pdf')st.doc={name:pending.name,text:pending.text};
  if(!text)text=img?'Is photo ke baare mein batao.':'Is document ka short summary do.';
  q.value='';q.placeholder='Apna sawaal likho...';pending=null;chip.hidden=true;
  busy=true;send.disabled=true;
  if(window.speechSynthesis)speechSynthesis.cancel();
  const h=document.querySelector('.hint');if(h)h.remove();
  addUser(text,img);st.msgs.push({r:'user',t:text,img:!!img});
  const bot=addBot(null);bot.body.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'+(img?' <small>Photo dekh raha hoon...</small>':'');
  let reply='',err=null;
  try{
    let r,d;const rid=Date.now()+'-'+Math.random().toString(36).slice(2);
    const body=JSON.stringify({messages:st.msgs.map(m=>({role:m.r,content:m.t})),image:img,doc:st.doc,lang:set.lang,mode:set.mode,rid});
    for(let i=0;i<(img?2:3);i++){
      r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body});
      d=await r.json().catch(()=>({error:'Error'}));
      if(r.ok||(r.status!==503&&r.status!==500))break;
      await new Promise(x=>setTimeout(x,2500));
    }
    if(!r.ok)throw new Error(d.error||'Kuch gadbad ho gayi, dobara try karo.');
    reply=d.reply;
  }catch(e){err=e.message||'Kuch gadbad ho gayi, dobara try karo.'}
  if(err){bot.body.textContent=err;st.msgs.pop()}
  else{
    bot.body.textContent='';await typeOut(bot.body,plain(reply));
    bot.body.innerHTML=md(reply);bot.el.appendChild(actions(reply));
    st.msgs.push({r:'assistant',t:reply});speak(reply);
  }
  save();busy=false;send.disabled=false;scroll();
}
$('f').addEventListener('submit',e=>{e.preventDefault();go()});
/* install + sw */
let dp=null;
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function updInst(){const b=$('inst');if(isApp()){b.textContent='✅ App installed';b.disabled=true}else{b.textContent='📲 Install app';b.disabled=false}}
updInst();
async function doInstall(){
  if(isApp())return;
  if(dp){dp.prompt();const r=await dp.userChoice;dp=null;$('ibar').hidden=true;if(r.outcome==='accepted')toast('Install ho raha hai ✅');return}
  toast(/iphone|ipad|ipod/i.test(navigator.userAgent)?'Safari mein Share ⬆️ dabao, phir "Add to Home Screen".':'Chrome ke ⋮ menu mein "Install app" ya "Add to Home screen" dabao.');
}
$('inst').onclick=doInstall;$('ibtn').onclick=doInstall;
$('ix').onclick=()=>{$('ibar').hidden=true;try{localStorage.setItem('debmitra_ibar','1')}catch(e){}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;let off=false;try{off=localStorage.getItem('debmitra_ibar')}catch(x){}if(!off&&!isApp())$('ibar').hidden=false});
addEventListener('appinstalled',()=>{dp=null;$('ibar').hidden=true;updInst();toast('App install ho gaya 🎉')});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
